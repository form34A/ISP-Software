services:
  db:
    image: mysql:5.7
    container_name: surfzone_db
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    networks:
      - surfzone_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 10s
      retries: 10
    mem_limit: 512m
    cpus: 0.5
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
      - --innodb_buffer_pool_size=256M

  redis:
    image: redis:alpine
    container_name: surfzone_redis
    ports:
      - "6379:6379"
    networks:
      - surfzone_network
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.2
    command: redis-server --save 60 1 --loglevel warning

  backend:
    image: codongo/surfzone_backend:latest
    container_name: surfzone_backend
    environment:
      - DJANGO_SETTINGS_MODULE=surfzone_logic.settings
      - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=1
    volumes:
      - ./Backend:/app/backend
      - static_volume:/app/backend/static
      - media_volume:/app/backend/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - surfzone_network
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.6
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  dashboard:
    image: codongo/surfzone_dashboard:latest
    container_name: surfzone_dashboard
    networks:
      - surfzone_network
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.4

  landingpage:
    image: codongo/surfzone_landing:latest
    container_name: surfzone_landing
    networks:
      - surfzone_network
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.3

  nginx:
    build: ./nginx
    container_name: surfzone_nginx
    ports:
      - "80:80"
    volumes:
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - ./Frontend/Landingpage/dist:/var/www/static/landing:ro
    depends_on:
      - backend
    networks:
      - surfzone_network
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.3

volumes:
  mysql_data:
  static_volume:
  media_volume:

networks:
  surfzone_network:
    driver: bridge
