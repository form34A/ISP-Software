worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 25m;

    upstream django_backend { server backend:8000; }

    server {
        listen 80;
        server_name _;

        # ---- Django API + admin ----
        location /api/ {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
        location /admin/ {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # ---- WebSockets (SMS features / channels) ----
        location /ws/ {
            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # ---- Django media (uploaded files) ----
        location /media/ {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
        }

        # ---- Vite static base paths (apps built with /static/... base) ----
        location /static/landing/ {
            alias /usr/share/nginx/html/;
            try_files $uri =404;
        }
        location /static/dashboard/ {
            alias /usr/share/nginx/html/dashboard/;
            try_files $uri =404;
        }

        # ---- Dashboard SPA (built with base /dashboard/) ----
        location /dashboard/ {
            alias /usr/share/nginx/html/dashboard/;
            try_files $uri $uri/ /dashboard/index.html;
        }

        # ---- Root redirects to the admin dashboard ----
        location = / {
            return 302 /dashboard/;
        }
        # ---- Captive portal buy page (server-rendered by Django) ----
        location /connect/ {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
        # ---- Landing/subscriber portal still available at /portal if needed ----
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
