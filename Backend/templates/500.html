<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 - Server Error</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
  }
  .container {
    text-align: center;
    padding: 2rem;
  }
  h1 {
    font-size: 2.5rem;
    margin: 0 0 0.5rem;
  }
  p {
    font-size: 1.1rem;
    color: #555;
    margin: 0 0 1.5rem;
  }
  a.button {
    display: inline-block;
    padding: 0.6rem 1.4rem;
    background: #2563eb;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-size: 1rem;
  }
  a.button:hover {
    background: #1d4ed8;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>500 &mdash; Server Error</h1>
    <p>Sorry, something went wrong on our end.</p>
    <a class="button" href="/dashboard/">Go to Dashboard</a>
  </div>
</body>
</html>
